# EchoVoice ML configuration (shared across training, export, and inference).
# Keep the feature contract in sync with lib/services/asr_pipeline.dart in the
# Flutter app and with echovoice_ml/features.py (this file is the record for
# humans; features.py is the executable source of truth).

feature_contract:
  sample_rate: 16000
  frame_length: 400      # 25 ms
  hop_length: 160        # 10 ms
  n_fft: 512
  num_mel_bins: 80
  mel_fmin: 80
  mel_fmax: 7600
  max_frames: 800        # 8 s max attempt

model:
  # "gru"  = original Conv+GRU baseline (fast iteration, small data)
  # "whisper" = real compressed Whisper encoder + CTC phoneme head (default)
  encoder: whisper
  whisper_model_id: openai/whisper-tiny.en   # or distil-whisper/distil-small.en, a local dir, "stub" for tests
  freeze_encoder: true                        # freeze all Whisper encoder weights
  unfreeze_last: 0                            # re-enable training on the last N encoder blocks
  quantize: none                              # none | int8 (torch dynamic quantization, CPU)
  conv_channels: 64                           # gru only
  rnn_hidden: 128
  rnn_layers: 2
  dropout: 0.2

training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.001
  val_split: 0.15
  seed: 42

paths:
  corpus_raw: data/corpus/manifest.jsonl
  corpus_prepared: data/prepared
  runs: runs
  export: export

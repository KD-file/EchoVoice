[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echovoice-ml"
version = "0.1.0"
description = "Phoneme-level acoustic model, features, alignment and scoring for EchoVoice."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.46",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
export = ["onnx>=1.15", "onnxscript>=0.7", "onnxruntime>=1.17", "onnx2tf>=1.24", "soundfile>=0.12"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["echovoice_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

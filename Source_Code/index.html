    body { font-family:'Inter',sans-serif; background-color:#FFFDF8;

    button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #4F46E5; outline-offset:2px; }
    .btn-tactile { transition:transform 140ms cubic-bezier(.34,1.56,.64,1), box-shadow 140ms ease, background-color 150ms ease; }
    .btn-tactile:hover { transform:translateY(-2px); }
    .btn-tactile:active { transform:translateY(1px); }
    @keyframes screenEnter { from{opacity:0;transform:translateY(10px) scale(.99)} to{opacity:1;transform:none} }

    function ctx() {
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, vol, type = 'sine', delay = 0) {
      const c = ctx(); if (!c) return;
      const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
    }

      if (!state.settings.music || musicTimer) return;

      const boxW = (pageW - 2 * margin - 16) / 3;
      const drawBox = (x, label, value, color) => {
        doc.setFillColor(245, 245, 255);
        doc.roundedRect(x, y, boxW, 24, 3, 3, 'F');
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...color);
        doc.text(value, x + boxW / 2, y + 10, { align: 'center' });
        doc.setFontSize(7.5);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(...gray);
        doc.text(label, x + boxW / 2, y + 19, { align: 'center' });
      };
      drawBox(margin, 'Avg Accuracy', avgAcc.toFixed(1) + '%', avgAcc >= 85 ? green : avgAcc >= 60 ? orange : red);
      drawBox(margin + boxW + 8, 'Avg WER', avgWer.toFixed(1) + '%', avgWer <= 15 ? green : avgWer <= 40 ? orange : red);
      drawBox(margin + 2 * (boxW + 8), 'Avg PER', avgPer.toFixed(1) + '%', avgPer <= 15 ? green : avgPer <= 40 ? orange : red);
      y += 32;

      // Per-word summary
      const perWord = {};
      attempts.forEach((a) => {
        if (!perWord[a.wordId]) perWord[a.wordId] = [];
        perWord[a.wordId].push(a);
      });
      const tableBody = Object.keys(perWord).map((id) => {
        const att = perWord[id];
        const avgA = att.reduce((s, a) => s + a.accuracy, 0) / att.length;
        const avgW = att.reduce((s, a) => s + a.wer, 0) / att.length;
        const avgP = att.reduce((s, a) => s + a.per, 0) / att.length;
        return [wordName(id), att.length.toString(), avgA.toFixed(1) + '%', avgW.toFixed(1) + '%', avgP.toFixed(1) + '%'];
      });
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...dark);
      doc.text('Per-Word Summary', margin, y);
      y += 6;
      doc.autoTable({
        startY: y,
        head: [['Word', 'Attempts', 'Avg Acc', 'Avg WER', 'Avg PER']],
        body: tableBody,
        margin: { left: margin, right: margin },
        styles: { fontSize: 8, cellPadding: 3 },
        headStyles: { fillColor: purple, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 7.5 },
        alternateRowStyles: { fillColor: [248, 249, 255] },
      });
      y = doc.lastAutoTable.finalY + 8;

      // Attempt log
      if (y > 230) { doc.addPage(); y = 20; }
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...dark);
      doc.text('Attempt Log', margin, y);
      y += 6;
      const logBody = attempts.map((a) => [
        wordName(a.wordId), a.accuracy.toFixed(1) + '%', a.wer.toFixed(1) + '%', a.per.toFixed(1) + '%', a.stars + '⭐', new Date(a.ts).toLocaleTimeString(),
      ]);
      doc.autoTable({
        startY: y,
        head: [['Word', 'Accuracy', 'WER', 'PER', 'Stars', 'Time']],
        body: logBody,
        margin: { left: margin, right: margin },
        styles: { fontSize: 7.5, cellPadding: 2.5 },
        headStyles: { fillColor: purple, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 7 },
        alternateRowStyles: { fillColor: [248, 249, 255] },
      });

      doc.save('Echovoice_Clinician_Report_' + name.replace(/\s+/g, '_') + '.pdf');
      showToast('Clinician Report downloaded!');
    }

    function renderLogo(size = 'md') {
      const imgH = size === 'lg' ? 'h-14 sm:h-16' : 'h-10';
      const titleSize = size === 'lg' ? 'text-2xl sm:text-3xl' : 'text-xl';
      return `<div class="inline-flex items-center gap-2.5">
        <img src="${LOGO_IMG}" alt="Kids Talk Speech Therapy logo" draggable="false" class="${imgH} w-auto rounded-xl select-none" />
        <span class="font-display ${titleSize} font-bold tracking-tight text-indigo-950">Echovoice</span></div>`;
    }

    function renderTopNav(activeKey = '') {
      const circle = (key) => activeKey === key
        ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm ring-2 ring-indigo-300'
        : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-300';
      const item = 'w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-indigo-50 flex items-center gap-3';
      return `
        <div class="flex items-start justify-between gap-2 pb-3 mb-2">
          <div class="relative shrink-0">
            <button type="button" id="btn-menu" aria-haspopup="true" aria-expanded="false" aria-controls="quick-menu" aria-label="Menu" title="Menu"
              class="btn-tactile w-11 h-11 rounded-full border-2 border-indigo-300 bg-white hover:bg-indigo-50 text-indigo-900 flex items-center justify-center text-xl font-bold"><span aria-hidden="true">☰</span></button>
            <div id="quick-menu" role="menu" class="hidden absolute left-0 top-full mt-2 w-56 z-30 bg-white rounded-2xl border-2 border-indigo-200 shadow-float p-1.5">
              <button type="button" role="menuitem" data-action="go-home" class="${item} text-slate-800">Home</button>
              <button type="button" role="menuitem" data-action="go-profile" class="${item} text-slate-800">Profile</button>
            <button type="button" role="menuitem" data-action="go-history" class="${item} text-slate-800">Session History</button>
              <button type="button" role="menuitem" data-action="go-report" class="${item} text-slate-800">Summary Report</button>
              <div class="my-1 border-t border-slate-200" role="separator"></div>
              <button type="button" role="menuitem" data-action="open-exit" class="${item} text-rose-700">Log out</button>
            </div>
          </div>
          <div class="flex flex-col sm:flex-row items-center gap-2.5 sm:gap-4 pt-0.5">
            <button type="button" data-action="go-home" aria-label="Echovoice Home" class="btn-tactile">${renderLogo('lg')}</button>
          </div>
          <div class="flex items-center gap-2.5">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-50 border-2 border-amber-300" title="Stars earned">
              <span class="text-xl leading-none" aria-hidden="true">⭐</span>
              <span class="font-display text-base font-bold text-amber-950">${totalStars()}</span>
            </div>
            <button type="button" data-action="go-settings" aria-label="Settings" title="Settings" class="btn-tactile shrink-0 w-11 h-11 rounded-full border-2 flex items-center justify-center text-lg ${circle('settings')}"><span aria-hidden="true">⚙️</span></button>
          </div>
        </div>`;
    }

    function getGuideInfo() {
      return { name: 'Maica', bubbleBorder: 'border-indigo-400', badgeClass: 'bg-indigo-100 text-indigo-900' };
    }

    function getScreenInstruction() {
      const guide = getGuideInfo();
      const userName = state.profile.name || 'Friend';
      const wordItem = WORDS.find((w) => w.id === state.selectedWordId) || WORDS[0];
      const stars = state.lastAttempt ? state.lastAttempt.stars : 3;
      switch (state.currentScreen) {

        case 'profile': return { title: `This is your learner profile, ${userName}!`, instruction: 'Tap EDIT to update your name, age, or gender, then tap SAVE.' };

    function renderWavingGuideSvg(sizePreset = 'md') {
      const h = sizePreset === 'hero' ? 'h-48 sm:h-60' : sizePreset === 'sm' ? 'h-24 sm:h-28' : 'h-32 sm:h-40';
      return `<img src="${MAICA_IMG}" alt="" aria-hidden="true" draggable="false" class="${h} w-auto shrink-0 guide-bob select-none drop-shadow-md" />`;
    }

    /**
     * One layout for EVERY screen: interface card on the left, and on the right a fixed column
     * with the speech bubble above the waving guide. The guide never moves between screens
     * and never floats over content.
     */
    function renderInterfaceWithExternalGuide(innerCardHtml, options = {}) {
      const guide = getGuideInfo();
      const copy = getScreenInstruction();
      const bubbleTitle = options.bubbleTitle || copy.title;
      const bubbleSubtitle = options.bubbleSubtitle !== undefined ? options.bubbleSubtitle : copy.instruction;
      const boardBorder = options.boardBorder || 'border-slate-300/90';
      return `
        <div class="relative mt-2 flex flex-col lg:flex-row items-stretch lg:items-end gap-4 lg:gap-0">
          <div class="flex-1 min-w-0 rounded-[2rem] bg-cream/95 border-2 ${boardBorder} p-4 sm:p-6 lg:pr-12 order-1">
            ${innerCardHtml}
          </div>
          <div class="lg:w-72 xl:w-80 shrink-0 flex flex-col items-center lg:items-end justify-end lg:-ml-8 z-10 order-2">
            <div class="w-full max-w-xs lg:max-w-none bg-white rounded-[2.25rem] px-4 py-3.5 border-2 ${guide.bubbleBorder} shadow-md mb-3 lg:-translate-x-4 relative">
              <div class="flex items-center justify-end gap-2 mb-1.5"></div>
              <p class="font-display text-base sm:text-lg font-bold text-slate-900 text-center leading-snug">${escapeHtml(bubbleTitle)}</p>
              ${bubbleSubtitle ? `<p class="text-xs font-semibold text-slate-600 text-center mt-1 leading-relaxed">${escapeHtml(bubbleSubtitle)}</p>` : ''}
              <div class="hidden lg:block absolute -bottom-2.5 right-16 w-4 h-4 bg-white border-r-2 border-b-2 ${guide.bubbleBorder} rotate-45"></div>
            </div>
            <div class="flex flex-col items-center lg:pr-2">
              ${renderWavingGuideSvg('hero')}
              <span class="mt-1 px-3 py-0.5 rounded-full text-xs font-bold ${guide.badgeClass} border border-slate-200">👋 ${guide.name}</span>
            </div>
          </div>
        </div>`;
    }

    const shell = (label, border, nav, body, extra = '') =>
      `<section aria-labelledby="${label}" class="w-full bg-white/95 rounded-[2.25rem] p-4 sm:p-7 shadow-card border-2 ${border} screen-enter ${extra}">${nav}${body}</section>`;
    const inputCls = 'w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 focus:border-indigo-500 text-base font-medium text-slate-900 transition';

    /* ---------- Screens ---------- */
    function renderLoginScreen() {
      const inner = `
        <form id="login-form" class="max-w-md mx-auto space-y-4 py-2">
          <div><label for="login-username" class="block text-sm font-bold text-slate-800 mb-1.5">Username</label>
            <input id="login-username" type="text" value="${escapeHtml(state.profile.name)}" placeholder="Enter username" class="${inputCls}" /></div>
          <div><label for="login-password" class="block text-sm font-bold text-slate-800 mb-1.5">Password</label>
            <input id="login-password" type="password" value="••••••••" placeholder="Enter password" class="${inputCls}" /></div>
          <div class="pt-2 grid grid-cols-2 gap-3.5">
            <button type="submit" class="btn-tactile py-3.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-tactile">Log in</button>
            <button type="button" data-action="go-signup" class="btn-tactile py-3.5 px-4 rounded-2xl bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold text-base border-2 border-amber-300">Sign up</button>
          </div>
        </form>`;
      return shell('login-heading', 'border-indigo-100', `<div class="text-center mb-4"><div class="mb-2 flex justify-center">${renderLogo('lg')}</div><h1 id="login-heading" class="font-display text-2xl sm:text-3xl font-bold text-slate-900">LOGIN</h1></div>`,
        renderInterfaceWithExternalGuide(inner, { boardBorder: 'border-indigo-200' }));
    }

    function renderSignupScreen() {
      const inner = `
        <form id="signup-form" class="max-w-md mx-auto space-y-4 py-2">
          <div><label for="signup-email" class="block text-sm font-bold text-slate-800 mb-1.5">Email</label><input id="signup-email" type="email" placeholder="parent@example.com" class="${inputCls}" /></div>
          <div><label for="signup-username" class="block text-sm font-bold text-slate-800 mb-1.5">Username</label><input id="signup-username" type="text" placeholder="Choose a friendly username" class="${inputCls}" /></div>
          <div><label for="signup-password" class="block text-sm font-bold text-slate-800 mb-1.5">Password</label><input id="signup-password" type="password" placeholder="Create a password" class="${inputCls}" /></div>
          <div class="pt-2 grid grid-cols-2 gap-3.5">
            <button type="button" data-action="go-login" class="btn-tactile py-3.5 px-4 rounded-2xl bg-white hover:bg-slate-100 text-slate-800 font-bold text-base border-2 border-slate-300">Cancel</button>
            <button type="submit" class="btn-tactile py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-tactile">Sign up</button>
          </div>
        </form>`;
      return shell('signup-heading', 'border-sky-100', `<div class="text-center mb-4"><div class="mb-2 flex justify-center">${renderLogo('lg')}</div><h1 id="signup-heading" class="font-display text-2xl sm:text-3xl font-bold text-slate-900">Sign Up</h1></div>`,
        renderInterfaceWithExternalGuide(inner, { boardBorder: 'border-sky-200' }));
    }

    function renderHomeScreen() {
      const cards = CATEGORIES.map((cat) => `
        <button type="button" data-category="${cat.id}" class="btn-tactile group p-4 sm:p-5 rounded-[1.75rem] border-2 ${cat.cardClass} shadow-card flex flex-col items-center justify-center text-center gap-2 min-h-[120px] sm:min-h-[136px]">
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl ${cat.iconBg} flex items-center justify-center text-3xl sm:text-4xl group-hover:scale-110 transition-transform" aria-hidden="true">${cat.emoji}</div>
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-900">${cat.title}</h2></button>`).join('');
      const inner = `
        <div class="mb-4">
          <h1 id="home-heading" class="font-display text-2xl sm:text-3xl font-bold text-slate-900 tracking-wide">HOME</h1>
          <p class="text-sm sm:text-base font-bold text-slate-700 mt-0.5">Pick one category</p>
        </div>
        <div class="grid grid-cols-2 gap-3.5 sm:gap-5">${cards}</div>
        <div class="p-4 sm:p-5 rounded-3xl bg-white border-2 border-indigo-100 mt-5">
          <h2 class="font-display text-lg sm:text-xl font-bold text-slate-900 mb-2">Custom Word Practice</h2>
          <p class="text-xs sm:text-sm text-slate-600 mb-3">Type any word, then hear it and try saying it.</p>
          <div class="flex flex-wrap gap-2 items-center">
            <input type="text" id="customWordInput" placeholder="e.g. airplane" class="flex-1 min-w-[160px] px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 text-base font-medium" />
            <button type="button" id="btn-custom-word" class="btn-tactile py-3 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-tactile">Say It Aloud</button>
            <button type="button" id="btn-custom-hear" class="btn-tactile py-3 px-4 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm shadow-tactile">Hear It Again</button>
          </div>
        </div>`;
      return shell('home-heading', 'border-indigo-100/90', renderTopNav(''), renderInterfaceWithExternalGuide(inner));
    }

    function toggleRow(id, title, sub, on, onColor) {
      return `
        <div class="p-4 sm:p-5 rounded-3xl bg-white border-2 border-slate-200/90 flex items-center justify-between gap-4">
          <div><div class="font-display text-lg sm:text-xl font-bold text-slate-900">${title}</div><div class="text-xs sm:text-sm font-medium text-slate-600">${sub}</div></div>
          <button type="button" id="${id}" role="switch" aria-checked="${on}" aria-label="${title} ${on ? 'on' : 'off'}"
            class="btn-tactile relative inline-flex items-center w-28 h-12 rounded-full p-1.5 border-2 transition ${on ? onColor + ' justify-end' : 'bg-slate-300 border-slate-400 justify-start'}">
            <span class="px-3 text-xs font-extrabold uppercase tracking-wider ${on ? 'text-white mr-auto' : 'text-slate-700 ml-auto'}">${on ? 'On' : 'Off'}</span>
            <span class="w-8 h-8 rounded-full bg-white shadow-md block"></span>
          </button>
        </div>`;
    }

    function renderSettingsScreen() {
      const { music, sound } = state.settings;
      const inner = `
        <div class="max-w-lg mx-auto">

    /* REPORT — the game's summary (attempts, unique words, accuracy, WER, PER, best word) + daily + weekly */
    function dayCard(label, off, tone) {
      const list = attemptsOn(off);
      const uniq = [...new Set(list.map((a) => a.wordId))];
      const pct = Math.round((uniq.length / WORDS.length) * 100);
      const t = { emerald: ['bg-emerald-50/90 border-emerald-200', 'text-emerald-950', 'bg-emerald-600', 'text-emerald-900', 'bg-emerald-200/80'], sky: ['bg-sky-50/90 border-sky-200', 'text-sky-950', 'bg-sky-600', 'text-sky-900', 'bg-sky-200/80'] }[tone];
      const msg = !list.length ? 'No practice yet. Say a few words!' : `Practiced: ${uniq.map(wordName).join(', ')} • ${pct >= 100 ? 'All words done!' : 'Great effort!'}`;
      return `
        <div class="p-4 sm:p-5 rounded-3xl ${t[0]} border-2">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="font-display text-lg font-bold ${t[1]}">Daily Report: ${label}</span>
            <span class="px-3 py-1 rounded-full ${t[2]} text-white text-xs font-bold">${uniq.length} / ${WORDS.length} Words</span>
          </div>
          <p class="text-sm font-medium ${t[3]} mb-3">${escapeHtml(msg)}</p>
          <div class="w-full h-3.5 rounded-full ${t[4]} overflow-hidden" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${label} practice progress"><div class="h-full ${t[2]} rounded-full" style="width:${pct}%"></div></div>
          ${list.length ? `<p class="text-xs font-semibold ${t[3]} mt-2">${list.length} ${list.length === 1 ? 'try' : 'tries'} • ${'⭐'.repeat(Math.round(avg(list, 'stars')))} average</p>` : ''}
        </div>`;
    }

    function renderReportScreen() {
      const all = state.attempts;
      const hasDemo = all.some((a) => a.demo);
      const uniqueAll = new Set(all.map((a) => a.wordId)).size;
      const perWord = {};
      all.forEach((a) => { (perWord[a.wordId] = perWord[a.wordId] || []).push(a.accuracy); });
      let best = '—', bestAcc = -1;
      Object.entries(perWord).forEach(([id, accs]) => { const m = accs.reduce((x, y) => x + y, 0) / accs.length; if (m > bestAcc) { bestAcc = m; best = wordName(id); } });
      const stat = (icon, val, label) => `<div class="p-3 rounded-2xl bg-white border border-indigo-200 text-center"><div class="text-lg" aria-hidden="true">${icon}</div><div class="font-display text-xl sm:text-2xl font-bold text-indigo-800">${val}</div><div class="text-xs font-semibold text-slate-600">${label}</div></div>`;

      const weekKeys = []; for (let i = 6; i >= 0; i--) weekKeys.push(keyOffset(i));
      const week = all.filter((a) => weekKeys.includes(dayKey(new Date(a.ts))));
      const weekStars = week.reduce((s, a) => s + a.stars, 0);
      const clarity = week.length ? Math.round(avg(week, 'accuracy')) : null;
      const counts = weekKeys.map((k) => week.filter((a) => dayKey(new Date(a.ts)) === k).length);
      const maxC = Math.max(1, ...counts);
      const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const bars = weekKeys.map((k, i) => { const [y, m, d] = k.split('-').map(Number); return `<div class="flex-1 flex flex-col items-center justify-end h-full text-xs font-semibold text-slate-600" title="${counts[i]} tries"><div class="w-full max-w-[34px] rounded-t-lg bg-indigo-500" style="height:${Math.max(4, Math.round((counts[i] / maxC) * 64))}px"></div><span class="mt-1">${wd[new Date(y, m - 1, d).getDay()]}</span></div>`; }).join('');

      const inner = `
        <div>
          <div class="flex items-center justify-between gap-3 mb-5">
            <div><h1 id="report-heading" class="font-display text-2xl sm:text-3xl font-bold text-slate-900">REPORT</h1><p class="text-sm sm:text-base font-medium text-slate-600">Summary, Daily Report &amp; Weekly Progress</p></div>
            <button type="button" data-action="go-home" class="btn-tactile px-4 py-2 rounded-2xl bg-white hover:bg-indigo-50 text-indigo-800 font-bold text-sm border-2 border-indigo-200">← Home</button>
          </div>
          ${hasDemo ? `<div class="mb-4 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-2.5 text-xs sm:text-sm font-semibold text-amber-950">Sample data shown. Practice a word and it will be replaced with your own results.</div>` : ''}
          <div class="space-y-4">
            <div class="p-4 sm:p-5 rounded-3xl bg-indigo-50/90 border-2 border-indigo-200">
              <div class="flex items-center justify-between gap-2 mb-3"><span class="font-display text-lg font-bold text-indigo-950">Summary</span><span class="px-3 py-1 rounded-full bg-indigo-600 text-white text-xs font-bold">All time</span></div>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${stat('📝', all.length, 'Total Attempts')}${stat('🔤', uniqueAll, 'Unique Words')}${stat('✅', all.length ? avg(all, 'accuracy').toFixed(1) + '%' : '—', 'Avg Accuracy')}
                ${stat('🎯', all.length ? avg(all, 'wer').toFixed(1) + '%' : '—', 'Avg Word Error Rate')}${stat('🔬', all.length ? avg(all, 'per').toFixed(1) + '%' : '—', 'Avg Phoneme Error Rate')}${stat('⭐', escapeHtml(best), 'Best Word')}
              </div>
            </div>
            ${dayCard('Today', 0, 'emerald')}
            ${dayCard('Yesterday', 1, 'sky')}
            <div class="p-4 sm:p-5 rounded-3xl bg-purple-50/90 border-2 border-purple-200">
              <div class="flex items-center justify-between gap-2 mb-3"><span class="font-display text-lg font-bold text-purple-950">Weekly Report</span><span class="px-3 py-1 rounded-full bg-purple-600 text-white text-xs font-bold">${computeStreak()}-Day Streak 🔥</span></div>
              <div class="grid grid-cols-3 gap-2.5 text-center">
                <div class="p-3 rounded-2xl bg-white border border-purple-200"><div class="font-display text-xl sm:text-2xl font-bold text-indigo-700">${week.length}</div><div class="text-xs font-semibold text-slate-600">Words Spoken</div></div>
                <div class="p-3 rounded-2xl bg-white border border-purple-200"><div class="font-display text-xl sm:text-2xl font-bold text-amber-600">${weekStars} ⭐</div><div class="text-xs font-semibold text-slate-600">Stars Earned</div></div>
                <div class="p-3 rounded-2xl bg-white border border-purple-200"><div class="font-display text-xl sm:text-2xl font-bold text-emerald-700">${clarity === null ? '—' : clarity + '%'}</div><div class="text-xs font-semibold text-slate-600">Clarity Score</div></div>
              </div>
              <div class="mt-3 flex items-end gap-2 h-24 bg-white rounded-2xl border border-purple-200 p-3" role="img" aria-label="Tries per day this week">${bars}</div>
            </div>
            <div class="flex flex-wrap gap-3">
              <button type="button" id="btn-child-pdf" class="btn-tactile py-2.5 px-5 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold text-sm border-2 border-amber-200">🧒 Child Report (PDF)</button>
              <button type="button" id="btn-clinician-pdf" class="btn-tactile py-2.5 px-5 rounded-2xl bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-bold text-sm border-2 border-indigo-200">🩺 Clinician Report (PDF)</button>
              <button type="button" id="btn-export-csv" class="btn-tactile py-2.5 px-5 rounded-2xl bg-white hover:bg-slate-100 text-slate-800 font-bold text-sm border-2 border-slate-300">📥 Export session data (CSV)</button>
              <button type="button" id="btn-clear-data" class="btn-tactile py-2.5 px-5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-800 font-bold text-sm border-2 border-rose-200">Clear practice data</button>
            </div>
          </div>
        </div>`;
      return shell('report-heading', 'border-indigo-100/80', renderTopNav('report'), renderInterfaceWithExternalGuide(inner));
    }

    function updatePrototypeNavHighlight() {
      document.querySelectorAll('.proto-pill').forEach((btn) => {
        const cur = btn.getAttribute('data-nav') === state.currentScreen;
        btn.classList.toggle('bg-indigo-600', cur); btn.classList.toggle('text-white', cur);
        btn.classList.toggle('bg-slate-100', !cur); btn.classList.toggle('text-slate-700', !cur);
      });
    }
    const SCREENS = { login: renderLoginScreen, signup: renderSignupScreen, home: renderHomeScreen, settings: renderSettingsScreen, profile: renderProfileScreen, exit: renderExitScreen, report: renderReportScreen, history: renderHistoryScreen, animals: renderAnimalsScreen, 'word-detail': renderWordDetailScreen, feedback: renderFeedbackScreen };
    function render() {
      const ssl = document.getElementById('status-sound-label'); if (ssl) ssl.textContent = state.settings.sound ? 'On' : 'Off';
      const sml = document.getElementById('status-music-label'); if (sml) sml.textContent = state.settings.music ? 'On' : 'Off';
      updatePrototypeNavHighlight();
      screenContainer.innerHTML = (SCREENS[state.currentScreen] || renderHomeScreen)();
      bindScreenEvents();
    }

    function bindScreenEvents() {
      const menuBtn = document.getElementById('btn-menu'), menu = document.getElementById('quick-menu');
      if (menuBtn) menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = menu.classList.toggle('hidden') === false;
        menuBtn.setAttribute('aria-expanded', String(open));
        if (open) menu.querySelector('button').focus();
      });
      const readBtn = document.getElementById('btn-read-guide');
      if (readBtn) readBtn.addEventListener('click', () => { const c = getScreenInstruction(); speakWord(`${c.title} ${c.instruction}`); });

      screenContainer.querySelectorAll('[data-action]').forEach((el) => el.addEventListener('click', () => {
        const a = el.getAttribute('data-action');
        if (a === 'go-home') navigateTo('home');
        if (a === 'go-login') navigateTo('login');
        if (a === 'go-signup') navigateTo('signup');
        if (a === 'go-settings') navigateTo('settings');
        if (a === 'go-profile') { state.profile.savedMessage = ''; navigateTo('profile'); }
        if (a === 'go-report') navigateTo('report');
        if (a === 'go-history') navigateTo('history');
        if (a === 'go-animals') navigateTo('animals');
        if (a === 'go-word-detail') navigateTo('word-detail');
        if (a === 'open-exit') exitModal.classList.remove('hidden');
        if (a === 'confirm-logout') { exitModal.classList.add('hidden'); showToast('You have logged out safely. See you soon!'); navigateTo('login'); }
      }));

      const loginForm = document.getElementById('login-form');
      if (loginForm) loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = document.getElementById('login-username').value.trim(); if (n) state.profile.name = n;
        saveStore(); showToast(`Welcome back, ${state.profile.name}!`); navigateTo('home');
      });
      const signupForm = document.getElementById('signup-form');
      if (signupForm) signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = document.getElementById('signup-username').value.trim(); if (n) state.profile.name = n;
        saveStore(); showToast(`Account created! Welcome to Echovoice, ${state.profile.name}!`); navigateTo('home');
      });

      screenContainer.querySelectorAll('[data-mood]').forEach((btn) => btn.addEventListener('click', () => {
        state.mood = btn.getAttribute('data-mood'); render(); speakWord(`You are feeling ${state.mood} today!`);
      }));
      screenContainer.querySelectorAll('[data-category]').forEach((btn) => btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-category');
        state.selectedCategory = id;
        navigateTo('animals');
      }));

      const tm = document.getElementById('toggle-music');
      if (tm) tm.addEventListener('click', () => {
        state.settings.music = !state.settings.music;
        if (state.settings.music) startMusic(); else stopMusic();
        saveStore(); render(); showToast(`Music turned ${state.settings.music ? 'On' : 'Off'}.`);
      });
      const ts = document.getElementById('toggle-sound');
      if (ts) ts.addEventListener('click', () => {
        state.settings.sound = !state.settings.sound;
        if (!state.settings.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
        saveStore(); render();
        if (state.settings.sound) { chime(); speakWord('Sound is on!'); } else showToast('Sound turned Off. Words and chimes are muted.');
      });

      const editBtn = document.getElementById('btn-edit-profile');
      if (editBtn) editBtn.addEventListener('click', () => { state.profile.editing = !state.profile.editing; state.profile.savedMessage = ''; render(); });
      const profileForm = document.getElementById('profile-form');
      if (profileForm) profileForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = document.getElementById('profile-name').value.trim(), a = document.getElementById('profile-age').value.trim();
        const b = document.getElementById('profile-birthdate').value.trim();
        if (n) state.profile.name = n; if (a) state.profile.age = a;
        if (b) state.profile.birthdate = b;
        state.profile.gender = document.getElementById('profile-gender').value;
        state.profile.editing = false; state.profile.savedMessage = 'Profile changes saved!'; saveStore(); render();
      });

      screenContainer.querySelectorAll('[data-word-id]').forEach((btn) => btn.addEventListener('click', () => { state.selectedWordId = btn.getAttribute('data-word-id'); navigateTo('word-detail'); }));
      const an = document.getElementById('btn-animals-next');
      if (an) an.addEventListener('click', () => { const cw = WORDS.filter((w) => w.category === state.selectedCategory); state.selectedWordId = cw.length ? cw[0].id : WORDS[0].id; navigateTo('word-detail'); });
      const cw = document.getElementById('btn-custom-word');
      if (cw) cw.addEventListener('click', () => {
        const input = document.getElementById('customWordInput');
        const val = input ? input.value.trim() : '';
        if (!val) { showToast('Type a word first.'); return; }
        state.customWord = val; state.selectedWordId = 'custom';
        navigateTo('word-detail');
        setTimeout(() => speakWord(val), 250);
      });
      const chh = document.getElementById('btn-custom-hear');
      if (chh) chh.addEventListener('click', () => { if (state.customWord) speakWord(state.customWord); else showToast('Type a word first.'); });

      const hear = document.getElementById('btn-hear-word');
      if (hear) hear.addEventListener('click', () => { const w = getSelectedWord(); speakWord(`${w.word}. ${w.description}`, w.soundCue); });
      const tryBtn = document.getElementById('btn-try-word');
      if (tryBtn) tryBtn.addEventListener('click', () => {
        if (state.practiceState === 'listening') return;
        state.practiceState = 'listening'; render();
        listenTimer = setTimeout(() => {
          recordAttempt(state.selectedWordId); // simulated recognition; logged for the report
          state.practiceState = 'success'; chime(); speakWord(state.lastAttempt.stars === 3 ? 'Very good!' : 'Nice try!');
          navigateTo('feedback');
        }, 1500);
      });
      const fn = document.getElementById('btn-feedback-next');
      if (fn) fn.addEventListener('click', () => {
        const i = WORDS.findIndex((w) => w.id === state.selectedWordId);
        state.selectedWordId = WORDS[(i + 1) % WORDS.length].id; navigateTo('word-detail');
      });

      const csv = document.getElementById('btn-export-csv'); if (csv) csv.addEventListener('click', exportCsv);
      const cp = document.getElementById('btn-child-pdf'); if (cp) cp.addEventListener('click', generateChildReportPDF);
      const clp = document.getElementById('btn-clinician-pdf'); if (clp) clp.addEventListener('click', generateClinicianReportPDF);
      const ch = document.getElementById('btn-clear-history'); if (ch) ch.addEventListener('click', () => { state.attempts = []; state.lastAttempt = null; saveStore(); render(); showToast('Session history cleared.'); });
      const clr = document.getElementById('btn-clear-data');
      if (clr) clr.addEventListener('click', () => { state.attempts = []; state.lastAttempt = null; saveStore(); render(); showToast('Practice data cleared.'); });
    }

    document.querySelectorAll('[data-nav]').forEach((btn) => btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-nav'))));
    document.getElementById('modal-cancel-logout').addEventListener('click', () => exitModal.classList.add('hidden'));
    document.getElementById('modal-confirm-logout').addEventListener('click', () => { exitModal.classList.add('hidden'); showToast('You have logged out safely. See you soon!'); navigateTo('login'); });
    function closeQuickMenu() { const m = document.getElementById('quick-menu'), b = document.getElementById('btn-menu'); if (m && !m.classList.contains('hidden')) { m.classList.add('hidden'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } } }
    document.addEventListener('click', (e) => { const m = document.getElementById('quick-menu'); if (m && !m.classList.contains('hidden') && !e.target.closest('#quick-menu')) { m.classList.add('hidden'); document.getElementById('btn-menu').setAttribute('aria-expanded', 'false'); } });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeQuickMenu(); if (!exitModal.classList.contains('hidden')) exitModal.classList.add('hidden'); } });

    /* ---------- Boot ---------- */
    loadStore();
    if (!state.attempts.length) { let had = false; try { had = localStorage.getItem(STORE_KEY) !== null; } catch (e) {} if (!had) { seedDemo(); saveStore(); } }
    render();
  </script>
</body>
</html>
